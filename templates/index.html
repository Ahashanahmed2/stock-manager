<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elliott Wave Analysis Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <!-- PWA Manifest -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Wave Pro">
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="apple-touch-icon" href="/static/icon.svg">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <style>
        :root {
            --wave-1: #22c55e;
            --wave-2: #f59e0b;
            --wave-3: #3b82f6;
            --wave-4: #8b5cf6;
            --wave-5: #ef4444;
            --wave-a: #ec4899;
            --wave-b: #f97316;
            --wave-c: #06b6d4;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #e2e8f0;
        }
        .wave-card {
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            border: 1px solid #334155;
        }
        .sub-wave-box {
            border-radius: 15px;
            padding: 15px;
            margin: 10px 0;
            position: relative;
        }
        .sub-wave-box::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            border-radius: 5px 0 0 5px;
        }
        .sub-wave-box.wave-a { background: rgba(236,72,153,0.1); border: 1px solid rgba(236,72,153,0.3); }
        .sub-wave-box.wave-a::before { background: var(--wave-a); }
        .sub-wave-box.wave-b { background: rgba(249,115,22,0.1); border: 1px solid rgba(249,115,22,0.3); }
        .sub-wave-box.wave-b::before { background: var(--wave-b); }
        .sub-wave-box.wave-c { background: rgba(6,182,212,0.1); border: 1px solid rgba(6,182,212,0.3); }
        .sub-wave-box.wave-c::before { background: var(--wave-c); }
        .wave-visual {
            background: #0f172a;
            border-radius: 15px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            line-height: 1.2;
            color: #94a3b8;
            white-space: pre;
            border: 1px solid #334155;
        }
        .wave-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-impulse { background: #065f46; color: #6ee7b7; }
        .badge-corrective { background: #7f1d1d; color: #fca5a5; }
        .badge-diagonal { background: #78350f; color: #fcd34d; }
        .badge-zigzag { background: #4a1d96; color: #c4b5fd; }
        .badge-flat { background: #1e3a5f; color: #93c5fd; }
        .badge-triangle { background: #3b0764; color: #d8b4fe; }
        .wave-label {
            font-size: 1.5rem;
            font-weight: 900;
            padding: 10px 20px;
            border-radius: 10px;
            display: inline-block;
        }
        .wave-label.w1 { background: var(--wave-1); color: white; }
        .wave-label.w2 { background: var(--wave-2); color: white; }
        .wave-label.w3 { background: var(--wave-3); color: white; }
        .wave-label.w4 { background: var(--wave-4); color: white; }
        .wave-label.w5 { background: var(--wave-5); color: white; }
        .wave-label.wa { background: var(--wave-a); color: white; }
        .wave-label.wb { background: var(--wave-b); color: white; }
        .wave-label.wc { background: var(--wave-c); color: white; }
        .summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 3px 0;
            background: #0f172a;
        }
        .form-control, .form-select {
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
        }
        .form-control:focus, .form-select:focus {
            background: #1e293b;
            border-color: #3b82f6;
            color: white;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.3);
        }
        .label-sm { color: #94a3b8; }
        .btn-gradient {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            color: white;
            font-weight: 700;
            padding: 12px 30px;
            border-radius: 10px;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59,130,246,0.4);
            color: white;
        }
        .section-title {
            font-weight: 800;
            color: #e2e8f0;
            border-bottom: 3px solid #3b82f6;
            padding-bottom: 8px;
            display: inline-block;
        }
        .nav-tabs .nav-link {
            border: none;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 10px 10px 0 0;
            margin-right: 5px;
        }
        .nav-tabs .nav-link.active {
            background: #1e293b;
            color: #3b82f6 !important;
            border-bottom: 3px solid #3b82f6;
        }
        .nav-tabs .nav-link:hover { color: #3b82f6 !important; }
        .table-dark {
            --bs-table-bg: transparent;
            --bs-table-color: #e2e8f0;
            border-color: #334155;
        }
        .table-dark td, .table-dark th {
            border-color: #334155;
            vertical-align: middle;
            font-size: 0.8rem;
        }
        .table-dark tbody tr:hover { background: rgba(59,130,246,0.1); }
    </style>
</head>
<body>
    <div class="container-fluid mt-3 mb-5">
        <nav class="navbar navbar-expand-lg rounded-3 mb-4" style="background: #0f172a; border: 1px solid #334155;">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#" style="color: #3b82f6;">🌊 Elliott Wave Analyzer Pro</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/" style="color: #94a3b8;">📈 Stocks</a>
            <a class="nav-link active" href="/wave-analysis" style="color: #3b82f6;">🌊 Wave Analysis</a>
        </div>
        <button id="installBtn" onclick="installApp()" 
                style="display:none; background:#3b82f6; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer;">
            📲 Install App
        </button>
    </div>
</nav>

        <!-- Tabs -->
        <ul class="nav nav-tabs mb-3" id="mainTabs">
            <li class="nav-item">
                <a class="nav-link active" data-bs-toggle="tab" href="#addStock">Add Stock</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#viewStocks">View Stocks</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#deleteAll">Delete All</a>
            </li>
        </ul>

        <div class="tab-content">
            <!-- Add Stock Tab -->
            <div class="tab-pane fade show active" id="addStock">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5>Add New Stock</h5>
                    </div>
                    <div class="card-body">
                        <form id="stockForm">
                            <div class="row">
                                <div class="col-md-3">
                                    <label class="form-label">Symbol</label>
                                    <input type="text" class="form-control" name="symbol" required placeholder="AAPL">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Buy Price</label>
                                    <input type="number" step="0.01" class="form-control" name="buy_price" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Quantity</label>
                                    <input type="number" class="form-control" name="quantity" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Date</label>
                                    <input type="date" class="form-control" name="date" id="inputDate">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary mt-3">Add Stock</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- View Stocks Tab -->
            <div class="tab-pane fade" id="viewStocks">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <div class="row">
                            <div class="col-md-6">
                                <h5>Stock List</h5>
                            </div>
                            <div class="col-md-3">
                                <input type="date" class="form-control" id="filterDate" placeholder="Filter by date">
                            </div>
                            <div class="col-md-3">
                                <input type="text" class="form-control" id="searchSymbol" placeholder="Search symbol...">
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover" id="stockTable">
                                <thead class="table-dark">
                                    <tr>
                                        <th>No</th>
                                        <th>Date</th>
                                        <th>Symbol</th>
                                        <th>Buy Price</th>
                                        <th>Quantity</th>
                                        <th>Total</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="stockTableBody">
                                    <tr>
                                        <td colspan="7" class="text-center">Loading stocks...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Delete All Tab -->
            <div class="tab-pane fade" id="deleteAll">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h5>Delete All Stocks by Date</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <label class="form-label">Select Date</label>
                                <input type="date" class="form-control" id="deleteDate">
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-danger mt-4" onclick="deleteAllByDate()">
                                    Delete All Stocks for this Date
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title">Edit Stock</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="form-label">Symbol</label>
                            <input type="text" class="form-control" id="editSymbol" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Buy Price</label>
                            <input type="number" step="0.01" class="form-control" id="editPrice" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Quantity</label>
                            <input type="number" class="form-control" id="editQuantity" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control" id="editDate" required>
                        </div>
                        <button type="submit" class="btn btn-warning">Update Stock</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Set today's date
        document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];

        // Add Stock
        document.getElementById('stockForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            try {
                const response = await fetch('/api/stocks', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ Stock added successfully!');
                    e.target.reset();
                    document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
                    loadStocks();
                } else {
                    alert('❌ Failed to add stock');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error: ' + error.message);
            }
        });

        // Filter handlers
        document.getElementById('filterDate').addEventListener('change', loadStocks);
        document.getElementById('searchSymbol').addEventListener('input', loadStocks);

        // Load Stocks
        async function loadStocks() {
            const date = document.getElementById('filterDate').value;
            const search = document.getElementById('searchSymbol').value;
            
            let url = '/api/stocks?';
            if (date) url += `date=${date}&`;
            if (search) url += `search=${encodeURIComponent(search)}`;
            
            const tbody = document.getElementById('stockTableBody');
            tbody.innerHTML = '<tr><td colspan="7" class="text-center">Loading...</td></tr>';
            
            try {
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                tbody.innerHTML = '';
                
                if (!data.stocks || data.stocks.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No stocks found</td></tr>';
                    return;
                }
                
                data.stocks.forEach((stock, index) => {
                    const row = tbody.insertRow();
                    const total = (stock.buy_price * stock.quantity).toFixed(2);
                    const stockDate = new Date(stock.date).toLocaleDateString();
                    
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${stockDate}</td>
                        <td><strong>${stock.symbol}</strong></td>
                        <td>$${stock.buy_price}</td>
                        <td>${stock.quantity}</td>
                        <td><strong>$${total}</strong></td>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick="editStock('${stock._id}')">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteStock('${stock._id}')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    `;
                });
                
            } catch (error) {
                console.error('Error loading stocks:', error);
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">Error: ${error.message}</td></tr>`;
            }
        }

        // Edit Stock
        async function editStock(id) {
            try {
                const response = await fetch(`/api/stocks/${id}`);
                const data = await response.json();
                const stock = data.stock;
                
                document.getElementById('editId').value = stock._id;
                document.getElementById('editSymbol').value = stock.symbol;
                document.getElementById('editPrice').value = stock.buy_price;
                document.getElementById('editQuantity').value = stock.quantity;
                document.getElementById('editDate').value = new Date(stock.date).toISOString().split('T')[0];
                
                new bootstrap.Modal(document.getElementById('editModal')).show();
            } catch (error) {
                console.error('Error:', error);
                alert('Error loading stock details');
            }
        }

        // Update Stock
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const formData = new FormData();
            formData.append('symbol', document.getElementById('editSymbol').value);
            formData.append('buy_price', document.getElementById('editPrice').value);
            formData.append('quantity', document.getElementById('editQuantity').value);
            formData.append('date', document.getElementById('editDate').value);
            
            try {
                const response = await fetch(`/api/stocks/${id}`, {
                    method: 'PUT',
                    body: formData
                });
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ Stock updated!');
                    bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
                    loadStocks();
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error updating stock');
            }
        });

        // Delete Stock
        async function deleteStock(id) {
            if (confirm('Are you sure you want to delete this stock?')) {
                try {
                    const response = await fetch(`/api/stocks/${id}`, {
                        method: 'DELETE'
                    });
                    const data = await response.json();
                    
                    if (data.success) {
                        alert('🗑️ Stock deleted!');
                        loadStocks();
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error deleting stock');
                }
            }
        }

        // Delete All by Date
        async function deleteAllByDate() {
            const date = document.getElementById('deleteDate').value;
            if (!date) {
                alert('Please select a date first');
                return;
            }
            
            if (confirm(`⚠️ Are you sure you want to delete ALL stocks for ${date}?`)) {
                try {
                    const response = await fetch(`/api/stocks/date/${date}`, {
                        method: 'DELETE'
                    });
                    const data = await response.json();
                    
                    if (data.success) {
                        alert(`✅ ${data.message}`);
                        loadStocks();
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error deleting stocks');
                }
            }
        }

        // Load stocks on page load
        loadStocks();
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
               navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
